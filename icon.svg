<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2133"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#1b212d"/>
      <stop offset="1" stop-color="#090c12"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ae3"/>
      <stop offset="1" stop-color="#e11dbb"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- scratch motion arcs -->
  <g fill="none" stroke="#22d3ee" stroke-linecap="round">
    <path d="M 58 212 A 196 196 0 0 1 132 104" stroke-width="16" opacity="0.95"/>
    <path d="M 30 226 A 226 226 0 0 1 112 76" stroke-width="10" opacity="0.5"/>
  </g>

  <!-- record -->
  <circle cx="240" cy="276" r="176" fill="url(#vinyl)" stroke="#2d3444" stroke-width="3"/>
  <g fill="none" stroke="#2a3142" stroke-width="2.5">
    <circle cx="240" cy="276" r="154"/>
    <circle cx="240" cy="276" r="134"/>
    <circle cx="240" cy="276" r="114"/>
    <circle cx="240" cy="276" r="94"/>
  </g>
  <path d="M 240 100 A 176 176 0 0 0 64 276 L 110 276 A 130 130 0 0 1 240 146 Z" fill="url(#sheen)"/>

  <!-- label -->
  <circle cx="240" cy="276" r="62" fill="#22d3ee"/>
  <circle cx="240" cy="276" r="62" fill="none" stroke="#0891b2" stroke-width="4"/>
  <rect x="236" y="222" width="8" height="30" rx="4" fill="#06303a" transform="rotate(-35 240 276)"/>
  <circle cx="240" cy="276" r="9" fill="#06303a"/>

  <!-- tonearm -->
  <circle cx="430" cy="92" r="30" fill="#2a3142" stroke="#3b4458" stroke-width="3"/>
  <circle cx="430" cy="92" r="13" fill="url(#arm)"/>
  <path d="M 430 92 L 404 300 L 356 352" fill="none" stroke="url(#arm)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="330" y="340" width="46" height="30" rx="7" fill="#ff4fd8" transform="rotate(42 353 355)"/>
</svg>
